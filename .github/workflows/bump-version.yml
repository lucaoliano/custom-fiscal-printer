name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo di incremento versione (SemVer)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

# Evita che due rilasci avviati insieme si contendano versione e tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Bump version and push tag
    # Rilascia solo da main, anche se il dispatch viene avviato da un altro branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # Verifica prima di creare commit e tag: se fallisce, main resta pulito
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and push tag
        id: bump
        run: |
          NEW_TAG=$(npm version ${{ inputs.release_type }} -m "chore(release): %s")
          git push origin HEAD --follow-tags
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  trigger-build-and-publish:
    name: Call Build and Publish
    needs: bump-and-tag
    uses: ./.github/workflows/build-and-publish.yml
    with:
      tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
    secrets: inherit
