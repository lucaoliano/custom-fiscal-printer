name: Build and Publish

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag appena creato da pubblicare (es. v1.0.1)'
        required: false
        type: string

# Permesso base di sola lettura per tutti i job (sicurezza per le Pull Request)
permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Se chiamato da bump-version usa il nuovo tag, altrimenti il ref corrente
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Create npm tarball
        if: matrix.os == 'ubuntu-latest' && (inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v'))
        run: npm pack

      - name: Upload package artifact
        if: matrix.os == 'ubuntu-latest' && (inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: test-and-build
    if: inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lucaoliano'

      - name: Publish to GitHub Packages
        run: npm publish *.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    needs: test-and-build
    if: inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.tgz"
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
